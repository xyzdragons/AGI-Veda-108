name: Reject foreign SHIVA GAME content in AGI-Veda-108
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check and remove unauthorized production paths
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d process ]; then
            echo "PASS: no process/ folder"
            exit 0
          fi
          if [ -z "$(git ls-files process)" ]; then
            echo "PASS: process/ has no tracked files"
            exit 0
          fi
          echo "::error::BLOCKED_WRONG_REPOSITORY: process/ production content belongs to private XYZ, not AGI-Veda-108."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -- process
          git commit -m "Quarantine unauthorized cross-project process content [skip ci]"
          git push origin "HEAD:main"
          echo "::error::Quarantined unauthorized public content. Existing commit history remains public: prevent by restricting write permissions or archiving this repo."
          exit 1
